spring.application.name=api

server.port=8081

# ------------------------------------------------------------------

# Definição do banco.
spring.datasource.url=jdbc:postgresql://localhost:5432/sgcdb

# Driver de acesso.
spring.datasource.driver-class-name=org.postgresql.Driver

# Usuário padrão.
spring.datasource.username=postgres

# Senha padrão.
spring.datasource.password=0000

# ------------------------------------------------------------------

# 'update' atualiza automaticamente o esquema (útil para desenvolvimento).
spring.jpa.hibernate.ddl-auto=update

# Exibe as consultas SQL no console (útil para depuração).
spring.jpa.show-sql=true

# Paths Swagger-UI
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/openapi

# Ordem alfabética para endpoints e tags
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha